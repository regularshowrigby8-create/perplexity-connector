name: live search

# A real test environment: a GitHub runner has an open network, so the engines
# this repo talks to can actually answer. This starts the API from the branch,
# asks it a question a person would type, and prints what came back — the same
# answer the page would render, with the ledger attached.

on:
  workflow_dispatch:
    inputs:
      q:
        description: "one question to ask; leave empty to ask the whole suite (one per mode)"
        required: false
        default: ""
      limit:
        description: "how many results to ask for (0 = no limit)"
        required: false
        default: "8"
  push:
    paths:
      - ".github/workflows/live-search.yml"
      # touch a file in here to run the same question again on demand
      - ".github/trigger/**"
      # and ask again whenever the engine itself changes
      - "apps/api/app/**"
      - "scripts/live_search.py"

permissions:
  contents: write

concurrency:
  group: live-search
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: install the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: start the API
        run: |
          cd apps/api
          NH_DATA_DIR="$RUNNER_TEMP/nh-data" nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "started $!"

      - name: wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "the API did not start:"; tail -40 "$RUNNER_TEMP/api.log"; exit 1

      # One question proves one question. The suite asks one per mode — a plain
      # how-to, something that must be fresh, an apk, a grant, a learnership, a
      # dataset, open data, and a site search — so a pass is about the engine and
      # not about a lucky query.
      - name: ask real questions
        run: |
          if [ -n "${{ github.event.inputs.q }}" ]; then
            python scripts/live_search.py \
              --base http://127.0.0.1:8000 \
              --q "${{ github.event.inputs.q }}" \
              --limit "${{ github.event.inputs.limit || '10' }}" \
              --json "$RUNNER_TEMP/answer.json" \
              --markdown "$RUNNER_TEMP/answer.md" | tee "$RUNNER_TEMP/answer.txt"
          else
            python scripts/live_search.py \
              --base http://127.0.0.1:8000 --suite \
              --limit "${{ github.event.inputs.limit || '8' }}" \
              --json "$RUNNER_TEMP/answer.json" \
              --markdown "$RUNNER_TEMP/answer.md" | tee "$RUNNER_TEMP/answer.txt"
          fi
          cat "$RUNNER_TEMP/answer.md" >> "$GITHUB_STEP_SUMMARY"

      - name: which sources answered
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "answer.json")
          if not os.path.exists(path):
              print("no answer file"); raise SystemExit(0)
          report = json.load(open(path))
          reports = report.get("suite") or [report]
          rows = []
          for one in reports:
              rows.extend(one.get("providers") or [])
          rows = sorted(rows, key=lambda p: (p["status"], p["id"]))
          print("\n| source | status | hits | note |\n|---|---|---|---|")
          for p in rows:
              if p["status"] in ("ok", "empty") and not p["count"] and p["status"] == "empty":
                  continue
              print(f"| {p['id']} | {p['status']} | {p['count']} | {(p.get('message') or '')[:60]} |")
          PY

      # The artifact is nice, but a runner's log is not always reachable from
      # where the work is being watched. The answer also goes into the repo, so
      # it can be read with a plain `git pull`.
      - name: keep the answer in the repo
        if: always()
        run: |
          set -e
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p reports/live-search
          if [ -f "$RUNNER_TEMP/answer.md" ]; then
            cp "$RUNNER_TEMP/answer.md" "reports/live-search/${stamp}.md"
            cp "$RUNNER_TEMP/answer.json" "reports/live-search/${stamp}.json" || true
          else
            printf 'the search did not produce an answer — see the run log\n' \
              > "reports/live-search/${stamp}.md"
          fi
          git config user.name "nighthawk runner"
          git config user.email "action@github.com"
          git add reports/live-search
          if git diff --cached --quiet; then
            echo "nothing to record"
          else
            git commit -m "live search: ${{ github.event.inputs.q || 'the suite (one query per mode)' }}"
            git push
          fi

      - name: keep the answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer
          path: |
            ${{ runner.temp }}/answer.json
            ${{ runner.temp }}/answer.md
            ${{ runner.temp }}/answer.txt
            ${{ runner.temp }}/api.log
          retention-days: 14
