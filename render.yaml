# Render blueprint — one service, one origin, nothing local.
#
# Render runs Docker, so this deploys the same image you run on a VPS: the page
# is served at / and the crawler answers at /api/v1/* from the same origin. There
# is no static/API split to wire up and no engine URL to paste into the page.
#
#   Render dashboard -> New -> Blueprint -> pick this repo and THIS branch
#
# Free by default. `plan: free` and no disk is the zero-cost configuration, and
# it is honest about the two things you give up:
#
#   - the instance sleeps after ~15 min idle, so the first request after a quiet
#     spell takes 30-60 s to wake
#   - without a disk the vault (SQLite/Whoosh/Tantivy) resets on every sleep,
#     deploy or restart. Search still works; your indexed documents do not
#     survive the night.
#
# If you ever want the index to persist, uncomment the `disk:` block and switch
# plan to `starter` — that is the only thing on this page that costs money.

services:
  - type: web
    name: nighthawk
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: commit   # redeploy on each push to the branch below
    envVars:
      - key: NH_DATA_DIR
        value: /tmp/nighthawk
      - key: NH_RATE_LIMIT_PER_MIN
        value: "120"
      - key: NH_USER_AGENT
        value: "Nighthawk/1.0 (+https://github.com/regularshowrigby8-create/perplexity-connector)"
    # disk:
    #   name: nighthawk-data
    #   mountPath: /data
    #   sizeGB: 1
