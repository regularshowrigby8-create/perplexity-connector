services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NH_USER_AGENT: "Nighthawk/1.0 (+https://example.org/bot)"
      NH_RATE_LIMIT_PER_MIN: "120"
    volumes:
      - nh-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nh-data:
